# Reverse proxy for the personal API. Adjust the server_name and certificate
# paths, then include this from your nginx config. Certificates can come from
# certbot:  sudo certbot --nginx -d api.example.com
#
# limit_req_zone must live in the http {} block. If this file is included from
# inside http {} (e.g. /etc/nginx/conf.d/), it's fine as is.

# 5 requests/second per client IP, with short bursts allowed below.
limit_req_zone $binary_remote_addr zone=personal_api:10m rate=5r/s;
limit_req_status 429;

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # The API only takes small GET requests.
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    location / {
        limit_except GET HEAD OPTIONS { deny all; }
        limit_req zone=personal_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

# If you put Cloudflare in front, every request arrives from a Cloudflare IP,
# so the per-IP limit above would throttle everyone together. Restore the real
# client IP first (list: https://www.cloudflare.com/ips/), e.g.:
#   set_real_ip_from 173.245.48.0/20;   # ...one line per Cloudflare range
#   real_ip_header CF-Connecting-IP;
